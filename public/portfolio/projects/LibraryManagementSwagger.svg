<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Library Management API Swagger documentation</title>
  <desc id="desc">Swagger interface showing administrator, authentication, books, students, and borrowing endpoints.</desc>
  <rect width="1200" height="675" fill="#f7f7f7"/>
  <rect width="1200" height="58" fill="#1b1b1b"/>
  <circle cx="54" cy="29" r="15" fill="#85d448"/>
  <text x="78" y="37" fill="#f4f4f4" font-family="Arial, sans-serif" font-size="22" font-weight="700">Swagger</text>
  <rect x="930" y="13" width="105" height="32" rx="3" fill="#85d448"/>
  <text x="982" y="35" text-anchor="middle" fill="#15210e" font-family="Arial, sans-serif" font-size="13" font-weight="700">Explore</text>

  <g font-family="Arial, sans-serif" fill="#242424">
    <text x="82" y="112" font-size="30" font-weight="700">Library Management API</text>
    <rect x="432" y="88" width="52" height="24" rx="12" fill="#7dcb45"/>
    <text x="458" y="105" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1.0.0</text>
    <rect x="495" y="88" width="68" height="24" rx="12" fill="#2e91cf"/>
    <text x="529" y="105" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">OAS 3.0</text>
    <text x="82" y="143" font-size="15" fill="#555">REST API for managing books, students, administrators, and borrowing workflows.</text>

    <text x="82" y="207" font-size="22" font-weight="700">Admins</text>
    <line x1="82" y1="218" x2="1118" y2="218" stroke="#df5353" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="82" y="236" width="1036" height="46" rx="4" fill="#f8e3e3" stroke="#ef7777"/>
    <rect x="96" y="245" width="58" height="28" rx="3" fill="#e95050"/>
    <text x="125" y="264" text-anchor="middle" fill="#fff" font-weight="700">DELETE</text>
    <text x="174" y="264" fill="#222" font-weight="700">/api/admins/{id}</text>

    <rect x="82" y="292" width="1036" height="46" rx="4" fill="#e4f2fb" stroke="#61affe"/>
    <rect x="96" y="301" width="58" height="28" rx="3" fill="#61affe"/>
    <text x="125" y="320" text-anchor="middle" fill="#fff" font-weight="700">GET</text>
    <text x="174" y="320" fill="#222" font-weight="700">/api/admins/{id}</text>

    <rect x="82" y="348" width="1036" height="46" rx="4" fill="#e8f6ef" stroke="#49cc90"/>
    <rect x="96" y="357" width="58" height="28" rx="3" fill="#49cc90"/>
    <text x="125" y="376" text-anchor="middle" fill="#fff" font-weight="700">POST</text>
    <text x="174" y="376" fill="#222" font-weight="700">/api/admins</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#242424">
    <text x="82" y="442" font-size="22" font-weight="700">Authentication</text>
    <line x1="82" y1="453" x2="1118" y2="453" stroke="#49cc90" stroke-width="2"/>
    <rect x="82" y="470" width="1036" height="46" rx="4" fill="#e8f6ef" stroke="#49cc90"/>
    <rect x="96" y="479" width="58" height="28" rx="3" fill="#49cc90"/>
    <text x="125" y="498" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">POST</text>
    <text x="174" y="498" fill="#222" font-size="15" font-weight="700">/api/auth/login</text>

    <text x="82" y="568" font-size="22" font-weight="700">Books · Students · Borrowing</text>
    <line x1="82" y1="579" x2="1118" y2="579" stroke="#61affe" stroke-width="2"/>
    <rect x="82" y="598" width="320" height="42" rx="4" fill="#e4f2fb" stroke="#61affe"/>
    <rect x="424" y="598" width="320" height="42" rx="4" fill="#e8f6ef" stroke="#49cc90"/>
    <rect x="766" y="598" width="352" height="42" rx="4" fill="#fff2dc" stroke="#fca130"/>
    <text x="242" y="625" text-anchor="middle" font-size="15" font-weight="700">Book catalogue</text>
    <text x="584" y="625" text-anchor="middle" font-size="15" font-weight="700">Student records</text>
    <text x="942" y="625" text-anchor="middle" font-size="15" font-weight="700">Borrowing workflow</text>
  </g>
</svg>
